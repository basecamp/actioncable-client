version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/go"
    groups:
      gomod:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  - package-ecosystem: npm
    directory: "/typescript"
    groups:
      npm:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  - package-ecosystem: uv
    directory: "/python"
    groups:
      uv:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  - package-ecosystem: bundler
    directory: "/ruby"
    groups:
      bundler:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  - package-ecosystem: gradle
    directory: "/kotlin"
    groups:
      gradle:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  - package-ecosystem: cargo
    directory: "/rust"
    groups:
      cargo:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

# No entry for swift/: the package has no dependencies to update.
