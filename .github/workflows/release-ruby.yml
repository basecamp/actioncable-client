name: Release Ruby client

# Not released automatically yet: a tag push does not run this. Only Go and
# Rust publish on a tag for now. To turn this on, add the push trigger back —
#
#   push:
#     tags:
#       - 'v*'
#
# — and add this file to the wait list in release-github.yml. RELEASING.md's
# "Before the first release" says what the registry needs first.
on:
  workflow_dispatch:  # Manual trigger is always dry-run (rehearsal mode)

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        # zizmor: ignore[cache-poisoning] -- cached deps are for testing, not release artifact generation
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby

      - name: Check
        run: make ruby-check

  # Building is deliberately separate from publishing: this job carries no
  # `environment:`, so a workflow_dispatch rehearsal runs it from any ref
  # without needing the release-rubygems deployment approval, and it holds no
  # publishing credentials. The publish job below pushes the exact .gem built
  # here rather than rebuilding.
  build:
    name: Build gem
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby

      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          GEM_VERSION=$(ruby -e "require_relative 'lib/actioncable_client/version'; puts ActionCableClient::VERSION")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$GEM_VERSION" >> "$GITHUB_OUTPUT"
            echo "Rehearsal for version: $GEM_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$GEM_VERSION" != "$VERSION" ]; then
              echo "::error::Gem version ($GEM_VERSION) does not match tag version ($VERSION)"
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Releasing version: $VERSION"
          fi

      - name: Build gem
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gem build actioncable-client.gemspec
          ls -l "actioncable-client-${VERSION}.gem"

      # `gem push` has no dry run, so verify the built artifact instead. The
      # gemspec globs its file list off the working tree, so a checkout that
      # went wrong would yield a well-formed gem with no library in it — which
      # RubyGems accepts and users cannot require.
      - name: Verify packaged gem
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ruby -e '
            require "rubygems/package"
            spec = Gem::Package.new(ARGV[0]).spec
            abort "::error::Packaged name is #{spec.name}, expected actioncable-client" unless spec.name == "actioncable-client"
            abort "::error::Packaged version is #{spec.version}, expected #{ARGV[1]}" unless spec.version.to_s == ARGV[1]
            lib = spec.files.grep(%r{\Alib/})
            abort "::error::Packaged gem contains no lib/ files" if lib.empty?
            abort "::error::Packaged gem is missing lib/actioncable_client.rb" unless lib.include?("lib/actioncable_client.rb")
            abort "::error::Packaged gem has runtime dependencies: #{spec.runtime_dependencies.map(&:name).join(", ")}" unless spec.runtime_dependencies.empty?
            puts "Packaged #{spec.full_name}: #{spec.files.size} files, #{lib.size} under lib/"
          ' "actioncable-client-${VERSION}.gem" "$VERSION"

      - name: Dry-run report
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::Dry run mode - not actually publishing"
          echo "Would publish: actioncable-client-${VERSION}.gem to RubyGems"

      - name: Upload gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubygem
          path: ruby/actioncable-client-*.gem
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to RubyGems
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release-rubygems
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Download gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygem
          path: ruby/

      # No checkout: this job pushes the gem the build job produced, so it needs
      # Ruby but not the repository. bundler-cache is therefore not used either.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        id: publish
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set +e
          output=$(gem push "actioncable-client-${VERSION}.gem" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Publish succeeded."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "repushing of gem versions is not allowed\|already been pushed" <<<"$output"; then
            echo "Version already published — treating as success for idempotency."
          else
            exit "$status"
          fi

      # rubygems-await used to run here. It reads the compact index through
      # Bundler's CompactIndexClient; Bundler 4.1.0, which `gem exec` installs
      # beside it, moved that class out of the Bundler namespace, and the
      # fallback then asks RubyGems' cache for a method it does not have. It
      # crashes on every poll, so it times out after a push that worked, as
      # it did for basecamp-sdk v0.38.0 and v0.39.0.
      #
      # This waits on what `gem install` and Bundler fetch, all from the
      # public index:
      #   - /info/actioncable-client has the version's line, and the sha256 that line
      #     names is the .gem's (Bundler refuses a download that differs);
      #   - /versions' last line for actioncable-client carries that file's MD5,
      #     which is how Bundler knows its cached copy is stale (read from
      #     the file's tail, where new lines are appended, and in full only
      #     when the tail has none);
      #   - the quick gemspec that RubyGems before 4.1 reads to install,
      #     as a file that inflates, not merely a 200;
      #   - the .gem itself, whose sha256 must match the v2 API's.
      # When this job did the push, that sha256 must also be the gem it
      # pushed. A run that found the version already published may have
      # rebuilt the gem (a full re-run does, and `gem build` stamps it with
      # the time), so its local file is not compared. A check that has passed
      # is not repeated, so a re-run long after a release stops reading the
      # full /versions once it has matched. Each request gives up after a
      # minute (the full /versions after three) or at the ten-minute deadline,
      # whichever is sooner, so the step reports what was missing well inside
      # its fifteen-minute limit.
      - name: Wait until the gem is installable
        shell: bash
        timeout-minutes: 15
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          AWAIT_SECONDS: 600
        run: |
          want=""
          if [ "$PUSHED" = true ]; then
            want=$(sha256sum "actioncable-client-${VERSION}.gem" | cut -d' ' -f1)
          fi
          # No request starts after the deadline, and none runs more than a
          # second past it (SECONDS counts whole seconds).
          fetch() {
            local left=$((deadline - SECONDS)) max=${limit:-60}
            [ "$left" -gt 0 ] || return 1
            [ "$left" -lt "$max" ] && max=$left
            curl -fsS --connect-timeout 10 --max-time "$max" -o "$2" "${@:3}" "$1" 2>/dev/null
          }
          index_line() { { tail -n +2 "$1" | grep '^actioncable-client ' || true; } | tail -n 1 | awk '{print $NF}'; }
          scratch=$(mktemp -d)
          deadline=$((SECONDS + AWAIT_SECONDS))
          info=no listed=no spec=no api="" file="" indexed=""
          while :; do
            # Read again while the index names another sha256 than the API's:
            # metadata that disagrees is not yet the release. What the last read
            # found stands until a newer read replaces it.
            if [ "$listed" = no ] || { [ -n "$api" ] && [ "$indexed" != "$api" ]; }; then
              line=""
              if fetch "https://index.rubygems.org/info/actioncable-client" "$scratch/info"; then
                info=no listed=no indexed=""
                line=$({ grep "^${VERSION//./\\.} " "$scratch/info" || true; } | tail -n 1)
              fi
              if [ -n "$line" ]; then
                info=yes
                indexed=$(sed -nE 's/.*[|,]checksum:([0-9a-f]{64})(,.*)?$/\1/p' <<<"$line")
                md5=$(md5sum "$scratch/info" | cut -d' ' -f1)
                last=""
                if fetch "https://index.rubygems.org/versions" "$scratch/versions" -r -2000000; then
                  last=$(index_line "$scratch/versions")
                fi
                if [ -z "$last" ] && limit=180 fetch "https://index.rubygems.org/versions" "$scratch/versions"; then
                  last=$(index_line "$scratch/versions")
                fi
                [ "$last" = "$md5" ] && listed=yes
              fi
            fi
            if [ "$spec" = no ] && fetch "https://rubygems.org/quick/Marshal.4.8/actioncable-client-${VERSION}.gemspec.rz" "$scratch/spec" \
                && ruby -rzlib -e 'exit(!Zlib::Inflate.inflate(File.binread(ARGV[0])).empty?)' "$scratch/spec" 2>/dev/null; then
              spec=yes
            fi
            if [ -z "$api" ] && fetch "https://rubygems.org/api/v2/rubygems/actioncable-client/versions/${VERSION}.json" "$scratch/api.json"; then
              api=$(jq -r '.sha // empty' "$scratch/api.json" 2>/dev/null || true)
              [[ "$api" =~ ^[0-9a-f]{64}$ ]] || api=""
            fi
            if [ -n "$want" ] && [ -n "$api" ] && [ "$api" != "$want" ]; then
              echo "::error::RubyGems reports actioncable-client ${VERSION} with sha256 ${api}, not the ${want} this job pushed."
              exit 1
            fi
            if [ -n "$api" ] && [ "$file" != "$api" ] && fetch "https://rubygems.org/gems/actioncable-client-${VERSION}.gem" "$scratch/gem"; then
              file=$(sha256sum "$scratch/gem" | cut -d' ' -f1)
            fi
            state="info: ${info}, versions: ${listed}, gemspec: ${spec}, API sha256: ${api:-none}, index sha256: ${indexed:-none}, downloaded sha256: ${file:-none}"
            if [ "$info" = yes ] && [ "$listed" = yes ] && [ "$spec" = yes ] && [ -n "$api" ] && [ "$indexed" = "$api" ] && [ "$file" = "$api" ]; then
              echo "actioncable-client ${VERSION} is installable (${state})."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::actioncable-client ${VERSION} was not installable after ${AWAIT_SECONDS}s of polling (${state})."
              exit 1
            fi
            echo "Waiting for actioncable-client ${VERSION} (${state})..."
            sleep 15
          done
