name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! version_error=$(scripts/validate-version.sh "${TAG#v}" 2>&1); then
            echo "::error::$version_error"
            exit 1
          fi
          if [[ "$(git cat-file -t "$TAG")" != "tag" ]]; then
            echo "::error::Release tag '$TAG' is not annotated"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run release quality gate
        run: make release-check

  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; continuing recovery"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi

      - name: Confirm Go module proxy publication
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module=$(go list -m)
          for attempt in 1 2 3 4 5 6; do
            if GOPROXY=https://proxy.golang.org go list -m "$module@$TAG"; then
              exit 0
            fi
            echo "Go module proxy has not indexed $TAG yet (attempt $attempt of 6)"
            sleep 10
          done
          echo "::error::Go module proxy could not resolve $module@$TAG"
          exit 1
