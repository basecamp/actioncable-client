name: Release Swift client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger is always dry-run (rehearsal mode)

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before release
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! grep -qxF "    public static let version = \"${VERSION}\"" swift/Sources/ActionCable/Version.swift; then
            echo "::error::swift/Sources/ActionCable/Version.swift does not match tag v${VERSION}"
            echo "Expected: public static let version = \"${VERSION}\""
            echo "Found:    $(grep 'static let version' swift/Sources/ActionCable/Version.swift)"
            exit 1
          fi

      # On workflow_dispatch GITHUB_REF is refs/heads/<branch>, so there is no
      # tag to verify against. Read the Swift source of truth instead.
      - name: Extract version
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(sed -n 's/.*public static let version = "\(.*\)".*/\1/p' swift/Sources/ActionCable/Version.swift)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from swift/Sources/ActionCable/Version.swift"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Rehearsal for version: $VERSION"

      - name: Check
        run: make swift-check

      # SwiftPM resolves a package from the root of a repository and cannot be
      # pointed at a subdirectory, so the root Package.swift is what consumers
      # actually build. It is the release artifact in everything but name.
      - name: Build the distribution manifest
        run: swift build --package-path .

      # Swift has no registry upload: consumers resolve the package straight
      # from the `vX.Y.Z` git tag on this repository, so the rehearsal exercises
      # everything a consumer would — manifest, build, tests — and then reports
      # the tag that carries the release.
      - name: Dry-run package verification
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          swift package describe --type json > /dev/null
          echo "The distribution manifest resolves."

          TAG="v${VERSION}"
          REMOTE_SHA=$(git ls-remote --tags --refs origin "$TAG" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            echo "Tag $TAG does not exist yet — it is what will trigger the real release run."
          else
            echo "Tag $TAG already exists at $REMOTE_SHA."
          fi

          echo "::notice::Dry run mode - not actually publishing"
          echo "Would publish: Swift package ActionCable at tag ${TAG} (resolved by SwiftPM from this repository; no artifact upload)"
